name: deploy-site

# Re-render and publish the Quarto site to GitHub Pages (gh-pages branch)
# on every push to main that touches site content, config, assets, or
# data, plus on demand.
#
# The daily course-data refresh runs LOCALLY (scripts/refresh_local.sh via
# launchd) because UBCO's calendar blocks GitHub's cloud runners. That job
# pushes the refreshed data/ to main, which triggers this workflow to
# republish the site, so the "course data last refreshed" stamp stays
# current without any cloud scrape.

on:
  push:
    branches: [main]
    paths:
      - "**/*.qmd"
      - "_quarto.yml"
      - "assets/**"
      - "data/**"
      - "docs/reference/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Install R packages for render
        run: install.packages(c("arrow", "dplyr", "DT", "jsonlite", "yaml", "stringr"))
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
