name: refresh-daily

# Daily scrape of the UBC Okanagan Academic Calendar.
#
#   1. Run data-raw/01_scrape_ubco_calendar.R -> data/courses.parquet
#      + data/scrape_meta.json.
#   2. Commit the refreshed data to main. The scrape_meta timestamp
#      changes on every successful run, so a healthy job lands a commit
#      daily; a frozen "course data last refreshed" date on the site is
#      the visible signal that the scrape has stopped working.
#   3. Re-render and publish the Quarto site to gh-pages so the live
#      freshness stamp tracks the scrape.
#   4. Only when the course CONTENT actually changed, and only if
#      shinyapps.io credentials are configured as repository secrets,
#      redeploy the planner so its bundled data updates too. (Between
#      content changes the planner shows the live "source last checked"
#      date by fetching the published scrape_meta.json, so it does not
#      need a daily redeploy.)
#
# Cadence: 12:00 UTC = 05:00 PT, after any overnight calendar edits.
# Also runnable on demand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: |
          install.packages(c(
            "rvest", "httr2", "dplyr", "stringr", "arrow", "purrr",
            "tibble", "jsonlite", "DT", "yaml"))
        shell: Rscript {0}

      - name: Run scraper
        run: Rscript data-raw/01_scrape_ubco_calendar.R

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "ubco-fw-refresh[bot]"
          git config user.email "ubco-fw-refresh@limnology.ca"
          if git diff --quiet -- data/; then
            echo "No data changes at all (unexpected: scrape_meta should change)."
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --quiet -- data/courses.parquet; then
              MSG="data: daily UBCO calendar refresh, no content change ($(date -u +%Y-%m-%d))"
              echo "content_changed=false" >> "$GITHUB_OUTPUT"
            else
              MSG="data: daily UBCO calendar refresh, content updated ($(date -u +%Y-%m-%d))"
              echo "content_changed=true" >> "$GITHUB_OUTPUT"
            fi
            git add data/
            git commit -m "$MSG"
            git push
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish site to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for shinyapps.io credentials
        id: gate
        env:
          TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SHINYAPPS_TOKEN not set; skipping planner redeploy. The site is updated; the planner shows the live 'source last checked' date and keeps its bundled data until the next manual deploy."
          fi

      - name: Redeploy planner (only on content change, if creds present)
        if: steps.gate.outputs.ok == 'true' && steps.commit.outputs.content_changed == 'true'
        env:
          SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          install.packages("rsconnect")
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_NAME"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET"))
          source("scripts/deploy.R")
        shell: Rscript {0}
